<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["DM Sans", "ui-sans-serif", "system-ui"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-800">
    <button
      id="profile-btn"
      type="button"
      class="fixed right-4 top-4 z-30 flex items-center gap-2 rounded-full border border-stone-300 bg-white px-4 py-2 text-sm font-semibold text-stone-800 shadow-sm hover:bg-stone-100"
      aria-label="Profile"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8" />
        <path
          d="M5 19.2c1.4-3 3.8-4.5 7-4.5s5.6 1.5 7 4.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
      Profile
    </button>

    <main class="mx-auto max-w-3xl px-4 pb-12 pt-20 sm:py-16">
      <header class="mb-10 text-center">
        <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-amber-700">What are you in the mood for?</p>
        <h1 class="text-3xl font-bold tracking-tight text-stone-900 sm:text-4xl">Mood Recipes</h1>
        <p class="mt-3 text-stone-600">Pick how you feel. We’ll suggest something to cook.</p>
      </header>

      <section id="mood-view">
        <div id="mood-grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4"></div>
        <p id="moods-error" class="mt-6 hidden text-center text-sm text-red-700"></p>
      </section>

      <section id="saved-view" class="hidden">
        <h2 class="mb-6 text-center text-2xl font-bold text-stone-900">Saved recipes</h2>
        <p id="saved-empty" class="hidden text-center text-stone-600">No saved recipes yet. Save one while browsing.</p>
        <p id="saved-error" class="mb-4 hidden rounded-lg bg-red-50 px-4 py-3 text-center text-sm text-red-700"></p>
        <ul id="saved-list" class="space-y-3"></ul>
        <div class="mt-6 flex justify-center">
          <button
            id="back-from-saved-btn"
            type="button"
            class="rounded-full border border-stone-300 bg-white px-5 py-2.5 text-sm font-semibold text-stone-800 hover:bg-stone-100"
          >
            Change mood
          </button>
        </div>
      </section>

      <section id="recipe-view" class="hidden">
        <p id="status" class="mb-4 text-center text-sm text-stone-500"></p>
        <p id="error" class="mb-4 hidden rounded-lg bg-red-50 px-4 py-3 text-center text-sm text-red-700"></p>
        <ul id="recipe-deck" class="recipe-deck hidden"></ul>
        <article id="recipe-card" class="hidden rounded-2xl border border-stone-200 bg-white p-6 shadow-sm sm:p-8">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p id="recipe-mood" class="text-sm font-semibold uppercase tracking-wide text-amber-700"></p>
              <h2 id="recipe-title" class="mt-1 text-2xl font-bold text-stone-900"></h2>
              <p id="recipe-time" class="mt-1 text-sm text-stone-500"></p>
            </div>
            <button
              id="save-btn"
              type="button"
              class="shrink-0 rounded-full border border-stone-300 px-4 py-2 text-sm font-semibold text-stone-800 hover:bg-stone-100"
            >
              Save
            </button>
          </div>
          <p id="recipe-description" class="mt-4 text-stone-700"></p>
          <div class="mt-6 grid gap-6 sm:grid-cols-2">
            <div>
              <h3 class="text-sm font-semibold uppercase tracking-wide text-stone-500">Ingredients</h3>
              <ul id="recipe-ingredients" class="mt-2 list-disc space-y-1 pl-5 text-stone-700"></ul>
            </div>
            <div>
              <h3 class="text-sm font-semibold uppercase tracking-wide text-stone-500">Steps</h3>
              <ol id="recipe-instructions" class="mt-2 list-decimal space-y-2 pl-5 text-stone-700"></ol>
            </div>
          </div>
        </article>
        <div class="mt-6 flex flex-wrap justify-center gap-3">
          <button
            id="back-to-saved-btn"
            type="button"
            class="hidden rounded-full bg-amber-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-amber-800"
          >
            Back to profile
          </button>
          <button
            id="change-mood-btn"
            type="button"
            class="rounded-full border border-stone-300 bg-white px-5 py-2.5 text-sm font-semibold text-stone-800 hover:bg-stone-100"
          >
            Change mood
          </button>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
